# Nightly drift checks. Replace `npm run test:nightly` with the project's slow checks.
# A failure files one open issue labeled nightly-failure, or comments on it if one is open,
# and uploads the full log as an artifact.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Slow checks
        shell: bash
        run: npm run test:nightly 2>&1 | tee nightly.log
      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-log
          path: nightly.log
          if-no-files-found: ignore
      - name: File issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create nightly-failure --color B60205 --force
          tail_log=$(tail -n 80 nightly.log 2>/dev/null || echo "no log")
          body=$(printf 'Run: %s\n\n```\n%s\n```\n' "$RUN_URL" "$tail_log")
          open=$(gh issue list --state open --label nightly-failure --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Nightly checks failed" --label nightly-failure --body "$body"
          fi
